<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solicitar Acesso | Polícia FEB - RH</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-deep: #0a0e27;
      --bg-card: rgba(26, 31, 58, 0.7);
      --cyan: #00d9ff;
      --gold: #f59e0b;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --border: rgba(0, 217, 255, 0.2);
      --success: #10b981;
      --error: #ef4444;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-deep);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container { width: 100%; max-width: 440px; }
    .header { text-align: center; margin-bottom: 2rem; }
    .logo-img {
      width: 100px;
      height: 100px;
      object-fit: contain;
      margin-bottom: 1rem;
      filter: drop-shadow(0 0 20px rgba(0, 217, 255, 0.3));
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid var(--gold);
      border-radius: 20px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--gold);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }
    .logo {
      font-family: 'Rajdhani', sans-serif;
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 1px;
      margin-bottom: 0.5rem;
    }
    .logo span {
      background: linear-gradient(135deg, var(--cyan) 0%, var(--gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle { color: var(--text-muted); font-size: 0.95rem; }
    .card {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }
    .card-title {
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--text);
    }
    .card-desc { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 2rem; }
    .input-group { margin-bottom: 1.5rem; }
    .input-label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      font-weight: 500;
      text-transform: uppercase;
    }
    input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(10, 14, 39, 0.6);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 1rem;
    }
    input:focus {
      outline: none;
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(0, 217, 255, 0.2);
    }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--cyan) 0%, #0ea5e9 100%);
      border: none;
      border-radius: 10px;
      color: var(--bg-deep);
      font-size: 1rem;
      font-weight: 600;
      font-family: 'Rajdhani', sans-serif;
      cursor: pointer;
      text-transform: uppercase;
    }
    button:hover:not(:disabled) { transform: translateY(-2px); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .msg {
      font-size: 0.9rem;
      text-align: center;
      margin-top: 1.2rem;
      padding: 10px;
      border-radius: 8px;
    }
    .msg.success { color: var(--success); background: rgba(16, 185, 129, 0.1); }
    .msg.error { color: var(--error); background: rgba(239, 68, 68, 0.1); }
    .footer { text-align: center; margin-top: 1.5rem; font-size: 0.8rem; color: var(--text-muted); }
    .footer a { color: var(--cyan); text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="../rh.png" alt="RH" class="logo-img">
      <div class="badge">Sistema Oficial</div>
      <h1 class="logo">POLÍCIA <span>FEB</span></h1>
      <p class="subtitle">Órgão de Recursos Humanos</p>
    </div>

    <div class="card">
      <h2 class="card-title">Solicitar Acesso</h2>
      <p class="card-desc">Insira seu nick do Habbo para solicitar acesso ao sistema.</p>
      
      <div class="input-group">
        <label class="input-label">Nickname do Habbo</label>
        <input type="text" id="nick" placeholder="Ex: SeuNick" autocomplete="off">
      </div>
      
      <button id="btn-solicitar">Solicitar Acesso</button>
      <div class="msg" id="msg"></div>
    </div>

    <div class="footer">
      Já tem acesso? <a href="login.html">Fazer login</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://hxcvjokstmwdcvwhvvvr.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh4Y3Zqb2tzdG13ZGN2d2h2dnZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExOTEwODQsImV4cCI6MjA5Njc2NzA4NH0._eBE0N4BRcbzw_cK2T3aZGWA_sLEvoiB2j1LEtJUTAI';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    document.getElementById('btn-solicitar').addEventListener('click', async () => {
      const btn = document.getElementById('btn-solicitar');
      const msg = document.getElementById('msg');
      const nick = document.getElementById('nick').value.trim();

      if (!nick) {
        msg.textContent = '❌ Digite seu nick.';
        msg.className = 'msg error';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Processando...';

      const email = nick.replace(/[^a-zA-Z0-9]/g, '').toLowerCase() + '@feb.internal';
      const tempPass = 'Temp' + Math.random().toString(36).slice(-8);

      try {
        const { data, error } = await sb.auth.signUp({ email, password: tempPass });
        if (error) throw error;

        const { error: profileError } = await sb.from('profiles').insert([
          { id: data.user.id, habbo_nick: nick, role: 'Membro', status: 'pendente', first_login: true }
        ]);
        if (profileError) throw profileError;

        msg.textContent = '✅ Solicitação enviada! Aguarde aprovação.';
        msg.className = 'msg success';
        document.getElementById('nick').value = '';
      } catch (err) {
        msg.textContent = '❌ ' + (err.message.includes('already') ? 'Nick já cadastrado.' : err.message);
        msg.className = 'msg error';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Solicitar Acesso';
      }
    });

    document.getElementById('nick').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') document.getElementById('btn-solicitar').click();
    });
  </script>
</body>
</html>
