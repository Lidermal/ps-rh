<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Polícia FEB - RH</title>
  <link rel="icon" type="image/png" href="../rh.png">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-deep: #0a0e27;
      --bg-card: rgba(26, 31, 58, 0.7);
      --cyan: #00d9ff;
      --gold: #f59e0b;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --border: rgba(0, 217, 255, 0.2);
      --success: #10b981;
      --error: #ef4444;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-deep);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }
    .bg-animation { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
    .bg-animation::before {
      content: '';
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(circle at 20% 50%, rgba(0, 217, 255, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(245, 158, 11, 0.05) 0%, transparent 50%);
      animation: bgPulse 8s ease-in-out infinite;
    }
    .bg-animation::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(0, 217, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 217, 255, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      animation: gridMove 20s linear infinite;
    }
    @keyframes bgPulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    @keyframes gridMove { 0% { transform: translate(0, 0); } 100% { transform: translate(50px, 50px); } }
    .particles { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: var(--cyan);
      border-radius: 50%;
      opacity: 0.3;
      animation: float 15s infinite;
      box-shadow: 0 0 10px var(--cyan);
    }
    .particle:nth-child(1) { left: 10%; animation-delay: 0s; animation-duration: 12s; }
    .particle:nth-child(2) { left: 20%; animation-delay: 2s; animation-duration: 14s; }
    .particle:nth-child(3) { left: 30%; animation-delay: 4s; animation-duration: 16s; }
    .particle:nth-child(4) { left: 50%; animation-delay: 1s; animation-duration: 13s; }
    .particle:nth-child(5) { left: 70%; animation-delay: 3s; animation-duration: 15s; }
    .particle:nth-child(6) { left: 90%; animation-delay: 5s; animation-duration: 17s; }
    @keyframes float {
      0%, 100% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      10% { opacity: 0.3; }
      90% { opacity: 0.3; }
      100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
    }
    .container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 520px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .header { text-align: center; margin-bottom: 2.5rem; animation: slideDown 0.8s ease-out; }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
    .logo-container { position: relative; display: inline-block; margin-bottom: 1.5rem; }
    .logo-glow {
      position: absolute;
      inset: -20px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.3) 0%, transparent 70%);
      animation: logoPulse 3s ease-in-out infinite;
      border-radius: 50%;
    }
    @keyframes logoPulse { 0%, 100% { transform: scale(1); opacity: 0.5; } 50% { transform: scale(1.1); opacity: 0.8; } }
    .logo-img {
      width: 100px;
      height: 100px;
      object-fit: contain;
      position: relative;
      filter: drop-shadow(0 0 30px rgba(245, 158, 11, 0.5));
      animation: logoFloat 6s ease-in-out infinite;
    }
    @keyframes logoFloat { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-10px) rotate(2deg); } }
    .badge {
      display: inline-block;
      padding: 6px 20px;
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid var(--gold);
      border-radius: 20px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
      animation: glow 2s ease-in-out infinite;
    }
    @keyframes glow { 0%, 100% { box-shadow: 0 0 5px rgba(245, 158, 11, 0.3); } 50% { box-shadow: 0 0 20px rgba(245, 158, 11, 0.6); } }
    .logo {
      font-family: 'Rajdhani', sans-serif;
      font-size: 2.8rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 3px;
      margin-bottom: 0.5rem;
      text-shadow: 0 0 30px rgba(245, 158, 11, 0.5);
    }
    .logo span {
      background: linear-gradient(135deg, var(--cyan) 0%, var(--gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle { color: var(--text-muted); font-size: 0.95rem; letter-spacing: 2px; text-transform: uppercase; }
    .card {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3rem 2.5rem;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.6), 0 0 60px rgba(245, 158, 11, 0.1);
      position: relative;
      overflow: hidden;
      animation: slideUp 0.8s ease-out 0.2s both;
    }
    @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--gold), var(--cyan), var(--gold), transparent);
      animation: borderGlow 3s linear infinite;
    }
    @keyframes borderGlow { 0% { filter: brightness(1); } 50% { filter: brightness(1.5); } 100% { filter: brightness(1); } }
    .card-title {
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .card-title::before {
      content: '';
      width: 5px;
      height: 28px;
      background: linear-gradient(180deg, var(--gold), var(--cyan));
      border-radius: 3px;
      box-shadow: 0 0 15px var(--gold);
    }
    .card-desc { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 2rem; line-height: 1.6; }
    .input-group { margin-bottom: 1.75rem; position: relative; }
    .input-label {
      display: block;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 10px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    input {
      width: 100%;
      padding: 16px 18px;
      background: rgba(10, 14, 39, 0.6);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 1rem;
      font-family: 'Inter', sans-serif;
      transition: all 0.3s;
    }
    input:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.15), 0 0 30px rgba(245, 158, 11, 0.2);
      background: rgba(10, 14, 39, 0.9);
      transform: translateY(-2px);
    }
    input::placeholder { color: #475569; }
    button {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--gold) 0%, #d97706 100%);
      border: none;
      border-radius: 12px;
      color: var(--bg-deep);
      font-size: 1rem;
      font-weight: 700;
      font-family: 'Rajdhani', sans-serif;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
    }
    button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      transition: left 0.5s;
    }
    button:hover::before { left: 100%; }
    button:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 15px 40px rgba(245, 158, 11, 0.4); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .msg {
      font-size: 0.9rem;
      text-align: center;
      margin-top: 1.5rem;
      padding: 14px;
      border-radius: 10px;
      display: none;
    }
    .msg.show { display: block; }
    .msg.success { color: var(--success); background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); }
    .msg.error { color: var(--error); background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); }
    .footer { text-align: center; margin-top: 2rem; padding: 1rem; font-size: 0.85rem; color: var(--text-muted); width: 100%; }
    .footer a { color: var(--cyan); text-decoration: none; font-weight: 600; position: relative; }
    .footer a::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 0;
      height: 2px;
      background: var(--cyan);
      transition: width 0.3s;
    }
    .footer a:hover::after { width: 100%; }
    .tech-line {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), var(--cyan), var(--gold), transparent);
      animation: lineMove 10s linear infinite;
      z-index: 100;
    }
    @keyframes lineMove { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
    @media (max-width: 480px) {
      .card { padding: 2.5rem 1.5rem; }
      .logo { font-size: 2.2rem; }
      .logo-img { width: 80px; height: 80px; }
    }
  </style>
</head>
<body>
  <div class="bg-animation"></div>
  <div class="particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
  
  <div class="container">
    <div class="header">
      <div class="logo-container">
        <div class="logo-glow"></div>
        <img src="../rh.png" alt="RH" class="logo-img">
      </div>
      <div class="badge">Acesso Restrito</div>
      <h1 class="logo">POLÍCIA <span>FEB</span></h1>
      <p class="subtitle">Órgão de Recursos Humanos</p>
    </div>

    <div class="card">
      <h2 class="card-title">Autenticação</h2>
      <p class="card-desc">Insira seu nick e senha para acessar o sistema.</p>
      
      <div class="input-group">
        <label class="input-label" for="nick">Nickname</label>
        <input type="text" id="nick" placeholder="Seu nick do Habbo" autocomplete="username" spellcheck="false">
      </div>
      
      <div class="input-group">
        <label class="input-label" for="pass">Senha</label>
        <input type="password" id="pass" placeholder="Sua senha pessoal" autocomplete="current-password">
      </div>
      
      <button id="btn-login">Entrar no Sistema</button>
      <div class="msg" id="msg"></div>
    </div>

    <div class="footer">
      Não tem acesso? <a href="solicitar.html">Solicite aqui</a>
    </div>
  </div>
  
  <div class="tech-line"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://hxcvjokstmwdcvwhvvvr.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh4Y3Zqb2tzdG13ZGN2d2h2dnZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExOTEwODQsImV4cCI6MjA5Njc2NzA4NH0._eBE0N4BRcbzw_cK2T3aZGWA_sLEvoiB2j1LEtJUTAI';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function showMessage(text, type) {
      const msg = document.getElementById('msg');
      msg.textContent = text;
      msg.className = `msg show ${type}`;
    }

    // Função simples de hash (em produção, use bcrypt no backend)
    async function hashPassword(password) {
      const encoder = new TextEncoder();
      const data = encoder.encode(password + '_FEB_SALT_2026');
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    document.getElementById('btn-login').addEventListener('click', async () => {
      const btn = document.getElementById('btn-login');
      const nick = document.getElementById('nick').value.trim();
      const pass = document.getElementById('pass').value;

      if (!nick || !pass) {
        showMessage('❌ Preencha todos os campos.', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Autenticando...';
      showMessage('', '');

      try {
        // 1. Busca o perfil pelo nick (case-insensitive)
        const { data: profile, error: profileError } = await sb
          .from('profiles')
          .select('*')
          .ilike('habbo_nick', nick)
          .maybeSingle();

        if (profileError) throw profileError;

        if (!profile) {
          showMessage('❌ Nick não encontrado. Solicite acesso primeiro.', 'error');
          btn.disabled = false;
          btn.textContent = 'Entrar no Sistema';
          return;
        }

        // 2. Verifica status
        if (profile.status === 'pendente') {
          showMessage('⏳ Seu acesso ainda está pendente. Aguarde aprovação.', 'error');
          btn.disabled = false;
          btn.textContent = 'Entrar no Sistema';
          return;
        }

        if (profile.status === 'banido') {
          showMessage('🚫 Sua conta foi banida.', 'error');
          btn.disabled = false;
          btn.textContent = 'Entrar no Sistema';
          return;
        }

        if (profile.status === 'inativo') {
          showMessage('⚠️ Sua conta está inativa. Contate a Diretoria.', 'error');
          btn.disabled = false;
          btn.textContent = 'Entrar no Sistema';
          return;
        }

        // 3. Se é primeiro acesso, vai para tela de criar senha
        if (profile.first_login || !profile.password_hash) {
          // Salva o ID do perfil no sessionStorage para usar na próxima tela
          sessionStorage.setItem('pending_user_id', profile.id);
          sessionStorage.setItem('pending_user_nick', profile.habbo_nick);
          window.location.href = 'primeiro-acesso.html';
          return;
        }

        // 4. Verifica a senha
        const inputHash = await hashPassword(pass);
        if (inputHash !== profile.password_hash) {
          showMessage('❌ Senha incorreta.', 'error');
          btn.disabled = false;
          btn.textContent = 'Entrar no Sistema';
          return;
        }

        // 5. Login bem-sucedido - salva sessão
        sessionStorage.setItem('user_id', profile.id);
        sessionStorage.setItem('user_nick', profile.habbo_nick);
        sessionStorage.setItem('user_role', profile.role);

        // 6. Atualiza last_activity
        await sb.from('profiles').update({
          last_activity: new Date().toISOString()
        }).eq('id', profile.id);

        // 7. Registra log
        try {
          await sb.from('system_logs').insert({
            user_id: profile.id,
            action: 'LOGIN_SUCESSO',
            details: 'Nick: ' + profile.habbo_nick,
            ip_address: 'web'
          });
        } catch (logErr) {
          console.warn('Erro ao registrar log:', logErr);
        }

        showMessage('✅ Acesso autorizado! Redirecionando...', 'success');
        setTimeout(() => {
          window.location.href = '../dashboard.html';
        }, 800);
      } catch (err) {
        console.error('Erro completo:', err);
        showMessage('❌ Erro: ' + (err.message || 'Erro desconhecido'), 'error');
        btn.disabled = false;
        btn.textContent = 'Entrar no Sistema';
      }
    });

    document.getElementById('pass').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') document.getElementById('btn-login').click();
    });
    document.getElementById('nick').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') document.getElementById('pass').focus();
    });
  </script>
</body>
</html>
