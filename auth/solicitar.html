<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solicitar Acesso | Polícia FEB - RH</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-deep: #0a0e27;
      --bg-mid: #1a1f3a;
      --bg-card: rgba(26, 31, 58, 0.7);
      --cyan: #00d9ff;
      --cyan-glow: rgba(0, 217, 255, 0.3);
      --gold: #f59e0b;
      --gold-glow: rgba(245, 158, 11, 0.3);
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --border: rgba(0, 217, 255, 0.2);
      --success: #10b981;
      --error: #ef4444;
    }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg-deep);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(rgba(0, 217, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 217, 255, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      z-index: 0;
    }
    body::after {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at center, rgba(0, 217, 255, 0.08) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }
    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
    }
    .header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .logo-img {
      width: 100px;
      height: 100px;
      object-fit: contain;
      margin-bottom: 1rem;
      filter: drop-shadow(0 0 20px rgba(0, 217, 255, 0.3));
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid var(--gold);
      border-radius: 20px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--gold);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }
    .badge::before {
      content: '🛡️';
      font-size: 1rem;
    }
    .logo {
      font-family: 'Rajdhani', sans-serif;
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 1px;
      margin-bottom: 0.5rem;
    }
    .logo span {
      background: linear-gradient(135deg, var(--cyan) 0%, var(--gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }
    .card {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      box-shadow: 
        0 20px 60px rgba(0, 0, 0, 0.5),
        0 0 40px var(--cyan-glow);
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--cyan), transparent);
    }
    .card-title {
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .card-title::before {
      content: '';
      width: 4px;
      height: 24px;
      background: var(--cyan);
      border-radius: 2px;
      box-shadow: 0 0 10px var(--cyan);
    }
    .card-desc {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 2rem;
      line-height: 1.5;
    }
    .input-group {
      position: relative;
      margin-bottom: 1.5rem;
    }
    .input-label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(10, 14, 39, 0.6);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 1rem;
      font-family: 'Inter', sans-serif;
      transition: all 0.3s ease;
    }
    input:focus {
      outline: none;
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px var(--cyan-glow);
      background: rgba(10, 14, 39, 0.9);
    }
    input::placeholder {
      color: #475569;
    }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--cyan) 0%, #0ea5e9 100%);
      border: none;
      border-radius: 10px;
      color: var(--bg-deep);
      font-size: 1rem;
      font-weight: 600;
      font-family: 'Rajdhani', sans-serif;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px var(--cyan-glow);
    }
    button:active {
      transform: translateY(0);
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .msg {
      font-size: 0.9rem;
      text-align: center;
      margin-top: 1.2rem;
      min-height: 20px;
      padding: 10px;
      border-radius: 8px;
      transition: all 0.3s ease;
    }
    .msg.success {
      color: var(--success);
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .msg.error {
      color: var(--error);
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      padding-bottom: 20px;
    }
    .footer a {
      color: var(--cyan);
      text-decoration: none;
      font-weight: 500;
    }
    .footer a:hover {
      text-shadow: 0 0 8px var(--cyan-glow);
    }
    .footer-logo {
      margin-top: 10px;
      opacity: 0.5;
    }
    .footer-logo img {
      width: 40px;
      height: 40px;
      object-fit: contain;
    }
    @media (max-width: 480px) {
      .card { padding: 2rem 1.5rem; }
      .logo { font-size: 1.8rem; }
      .logo-img { width: 80px; height: 80px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="../rh.png" alt="Polícia FEB - RH" class="logo-img">
      <div class="badge">Sistema Oficial</div>
      <h1 class="logo">POLÍCIA <span>FEB</span></h1>
      <p class="subtitle">Órgão de Recursos Humanos</p>
    </div>

    <div class="card">
      <h2 class="card-title">Solicitar Acesso</h2>
      <p class="card-desc">Insira seu nick do Habbo para solicitar autorização de acesso ao sistema interno. Sua solicitação será analisada pela Diretoria.</p>
      
      <div class="input-group">
        <label class="input-label" for="nick">Nickname do Habbo</label>
        <input type="text" id="nick" placeholder="Ex: SeuNickAqui" autocomplete="off" spellcheck="false">
      </div>
      
      <button id="btn-solicitar">Solicitar Acesso</button>
      <div class="msg" id="msg"></div>
    </div>

    <div class="footer">
      Já possui acesso? <a href="login.html">Fazer login</a>
      <div class="footer-logo">
        <img src="../rh.png" alt="RH">
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseUrl = 'https://hxcvjokstmwdcvwhvvvr.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh4Y3Zqb2tzdG13ZGN2d2h2dnZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExOTEwODQsImV4cCI6MjA5Njc2NzA4NH0._eBE0N4BRcbzw_cK2T3aZGWA_sLEvoiB2j1LEtJUTAI';
    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

    document.getElementById('btn-solicitar').onclick = async () => {
      const btn = document.getElementById('btn-solicitar');
      const msg = document.getElementById('msg');
      const nick = document.getElementById('nick').value.trim();

      if (!nick) return showMsg('❌ Digite seu nick do Habbo.', 'error');
      if (nick.length < 3) return showMsg('❌ Nick muito curto.', 'error');
      
      btn.disabled = true;
      btn.textContent = 'Processando...';

      const email = `${nick.replace(/[^a-zA-Z0-9]/g, '').toLowerCase()}@feb.internal`;
      const tempPass = `Temp${Math.random().toString(36).slice(-8)}!${Math.floor(Math.random() * 99)}`;

      try {
        const { data, error } = await supabase.auth.signUp({ email, password: tempPass });
        if (error) throw error;

        const { error: profileError } = await supabase.from('profiles').insert([
          { id: data.user.id, habbo_nick: nick, role: 'Membro', status: 'pendente', first_login: true }
        ]);
        if (profileError) throw profileError;

        showMsg('✅ Solicitação enviada! Aguarde a aprovação da Diretoria.', 'success');
        document.getElementById('nick').value = '';
      } catch (err) {
        showMsg(`❌ ${err.message.includes('already') || err.message.includes('registered') ? 'Este nick já está cadastrado.' : err.message}`, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Solicitar Acesso';
      }
    };

    function showMsg(text, type) {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.className = `msg ${type}`;
    }

    document.getElementById('nick').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') document.getElementById('btn-solicitar').click();
    });
  </script>
</body>
</html>
