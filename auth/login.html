<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login RH | Polícia FEB</title>
  <link rel="icon" type="image/png" href="../rh.png">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }
    
    :root {
      --bg-deep: #030512; /* Fundo mais escuro para contraste neon */
      --bg-card: rgba(6, 10, 29, 0.6);
      --cyan: #00f2fe; /* Ciano mais vibrante */
      --cyan-glow: rgba(0, 242, 254, 0.5);
      --gold: #ffac00; /* Ouro mais saturado */
      --gold-glow: rgba(255, 172, 0, 0.5);
      --text: #ffffff;
      --text-muted: #8b9bb4;
      --border: rgba(0, 242, 254, 0.15);
      --success: #00ff88;
      --error: #ff4444;
      --font-tech: 'Rajdhani', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    body {
      font-family: var(--font-body);
      background: var(--bg-deep);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* --- Background Tecnológico Avançado --- */
    .bg-container {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: 
        radial-gradient(circle at 10% 10%, rgba(0, 242, 254, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(255, 172, 0, 0.05) 0%, transparent 40%),
        linear-gradient(180deg, #030512 0%, #0a0e27 50%, #030512 100%);
    }

    /* Grid com perspectiva */
    .bg-grid {
      position: absolute;
      width: 200%;
      height: 200%;
      top: -50%;
      left: -50%;
      background-image: 
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 50px 50px;
      transform: perspective(500px) rotateX(60deg);
      animation: gridMove 20s linear infinite;
      opacity: 0.2;
    }

    @keyframes gridMove {
      0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
      100% { transform: perspective(500px) rotateX(60deg) translateY(50px); }
    }

    /* Linhas de varredura (Scanlines) */
    .scanlines {
      position: fixed;
      inset: 0;
      background: linear-gradient(to bottom, rgba(255,255,255,0.02) 50%, rgba(0,0,0,0.02) 50%);
      background-size: 100% 4px;
      z-index: 1;
      pointer-events: none;
      opacity: 0.5;
    }

    /* --- Sistema de Avatares Laterais (Foco RH + Tech) --- */
    .avatar-panel {
      position: fixed;
      bottom: 0;
      height: 80vh;
      width: 25vw;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 5vh;
      pointer-events: none;
    }

    .avatar-panel.left { left: 0; }
    .avatar-panel.right { right: 0; }

    /* Círculos de dados atrás dos avatares */
    .data-ring {
      position: absolute;
      border-radius: 50%;
      border: 2px dashed;
      animation: rotate 10s linear infinite;
      opacity: 0.2;
    }

    .left .data-ring {
      border-color: var(--cyan);
      box-shadow: 0 0 15px var(--cyan-glow);
      width: 300px; height: 300px;
      bottom: 10vh;
    }

    .right .data-ring {
      border-color: var(--gold);
      box-shadow: 0 0 15px var(--gold-glow);
      width: 300px; height: 300px;
      bottom: 10vh;
      animation-direction: reverse;
    }

    @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .avatar-img {
      height: 70vh; /* Aumentado para destaque */
      object-fit: contain;
      position: relative;
      z-index: 3;
      filter: drop-shadow(0 0 15px rgba(0,0,0,0.8));
      animation: avatarFloat 4s ease-in-out infinite;
    }

    /* Efeito holográfico específico por lado */
    .left .avatar-img {
      filter: drop-shadow(0 0 20px var(--cyan-glow)) hue-rotate(-10deg);
    }
    .right .avatar-img {
      filter: drop-shadow(0 0 20px var(--gold-glow)) hue-rotate(10deg);
      animation-delay: -2s; /* Desincronizar flutuação */
    }

    @keyframes avatarFloat {
      0%, 100% { transform: translateY(0); opacity: 0.8; }
      50% { transform: translateY(-15px); opacity: 1; }
    }

    /* Labels técnicos abaixo dos avatares */
    .status-label {
      font-family: var(--font-tech);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      padding: 5px 15px;
      background: rgba(0,0,0,0.5);
      border: 1px solid;
      border-radius: 4px;
      margin-top: -50px; /* Sobrepor levemente a base do avatar */
      z-index: 4;
      position: relative;
    }
    .left .status-label { color: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 10px var(--cyan-glow); }
    .right .status-label { color: var(--gold); border-color: var(--gold); box-shadow: 0 0 10px var(--gold-glow); }

    /* --- Container Principal de Login --- */
    .container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      perspective: 1000px;
    }

    /* Cabeçalho */
    .header {
      text-align: center;
      margin-bottom: 2rem;
      animation: fadeInDown 1s ease-out;
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo-img {
      width: 90px; height: 90px;
      object-fit: contain;
      filter: drop-shadow(0 0 15px var(--cyan-glow));
      animation: logoGlitch 5s infinite;
    }

    /* Efeito Glitch sutil na logo */
    @keyframes logoGlitch {
      0%, 90%, 100% { transform: translate(0); filter: drop-shadow(0 0 15px var(--cyan-glow)); }
      92% { transform: translate(-2px, 2px); filter: drop-shadow(2px 0 red) drop-shadow(-2px 0 blue); }
      95% { transform: translate(2px, -2px); }
    }

    .logo {
      font-family: var(--font-tech);
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #fff;
      margin-top: 10px;
      text-shadow: 0 0 20px var(--cyan-glow);
    }
    .logo span {
      color: var(--gold);
      text-shadow: 0 0 20px var(--gold-glow);
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-family: var(--font-tech);
    }

    /* --- O Card de Login (Estilo Float/Holograma) --- */
    .card {
      background: var(--bg-card);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid var(--border);
      padding: 2.5rem;
      width: 100%;
      position: relative;
      
      /* Cortar cantos tecnologicamente */
      clip-path: polygon(0 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%);
      
      box-shadow: 
        0 15px 35px rgba(0,0,0,0.5),
        inset 0 0 15px rgba(0, 242, 254, 0.05);
      
      animation: cardSpawn 1s ease-out 0.3s both;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-5px) rotateX(2deg);
      box-shadow: 
        0 20px 40px rgba(0,0,0,0.6),
        0 0 20px rgba(0, 242, 254, 0.1);
    }

    @keyframes cardSpawn {
      from { opacity: 0; transform: translateY(30px) rotateX(-10deg); }
      to { opacity: 1; transform: translateY(0) rotateX(0deg); }
    }

    /* Linha brilhante no topo */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 2px;
      background: linear-gradient(90deg, transparent, var(--cyan), var(--gold), transparent);
    }

    /* Reflexo na parte inferior (efeito flutuante) */
    .card-reflection {
      position: absolute;
      bottom: -40px; left: 10%; width: 80%; height: 20px;
      background: linear-gradient(to bottom, rgba(0, 242, 254, 0.1), transparent);
      filter: blur(5px);
      border-radius: 50%;
      z-index: -1;
    }

    .card-title {
      font-family: var(--font-tech);
      font-size: 1.4rem;
      font-weight: 600;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    /* Ponto pulsante de "Link Estabelecido" */
    .card-title::before {
      content: '';
      width: 8px; height: 8px;
      background-color: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--success);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* --- Formulário --- */
    .input-group { margin-bottom: 1.5rem; position: relative; }

    .input-label {
      font-family: var(--font-tech);
      font-size: 0.75rem;
      color: var(--cyan);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 8px;
      display: block;
    }

    .input-wrapper { position: relative; }

    /* Ícone visual (Tech bracket) */
    .input-wrapper::before {
      content: '[';
      position: absolute; left: 12px; top: 50%;
      transform: translateY(-50%);
      color: var(--border);
      font-family: monospace;
      transition: color 0.3s;
    }

    input {
      width: 100%;
      padding: 15px 15px 15px 30px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      color: #fff;
      font-family: var(--font-body);
      font-size: 0.9rem;
      transition: all 0.3s ease;
    }

    input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 15px var(--cyan-glow);
      background: rgba(0, 0, 0, 0.5);
    }

    input:focus + .input-label { color: #fff; }
    
    /* Mudar bracket pra ouro no focus */
    input:focus-within ~ .input-wrapper::before,
    .input-group:focus-within ::before { color: var(--gold); }

    input::placeholder { color: #4e5d72; }

    /* Botão de Login (Neon Ouro) */
    button {
      width: 100%;
      padding: 16px;
      background: transparent;
      border: 2px solid var(--gold);
      color: var(--gold);
      font-family: var(--font-tech);
      font-size: 1.1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 3px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
      clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
    }

    button:hover:not(:disabled) {
      background: var(--gold);
      color: var(--bg-deep);
      box-shadow: 0 0 30px var(--gold-glow);
    }

    button:disabled { opacity: 0.5; cursor: not-allowed; border-color: var(--text-muted); color: var(--text-muted); }

    /* Efeito de brilho passando no botão ao passar o mouse */
    button::after {
      content: '';
      position: absolute;
      top: -50%; left: -60%; width: 20%; height: 200%;
      background: rgba(255,255,255,0.5);
      transform: rotate(30deg);
      transition: left 0.5s;
    }
    button:hover::after { left: 120%; }

    /* Mensagens de erro/sucesso */
    .msg {
      font-size: 0.85rem;
      text-align: center;
      margin-top: 1rem;
      padding: 10px;
      display: none;
      font-family: var(--font-tech);
      letter-spacing: 1px;
    }
    .msg.show { display: block; animation: shake 0.4s ease-in-out; }
    
    .msg.error { color: var(--error); border-left: 2px solid var(--error); background: rgba(255,68,68,0.1); }
    .msg.success { color: var(--success); border-left: 2px solid var(--success); background: rgba(0,255,136,0.1); }

    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

    /* Footer */
    .footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      animation: fadeIn 1s ease-out 0.6s both;
    }

    .footer a {
      color: var(--cyan);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s;
    }
    .footer a:hover { color: #fff; text-shadow: 0 0 10px var(--cyan); }

    /* Linha técnica rodapé */
    .tech-line {
      position: fixed; bottom: 0; left: 0; width: 100%; height: 3px;
      background: linear-gradient(90deg, var(--cyan), var(--gold), var(--cyan));
      box-shadow: 0 0 15px var(--cyan);
      z-index: 100;
    }

    /* Responsividade */
    @media (max-width: 1200px) {
      .avatar-panel { width: 20vw; }
      .avatar-img { height: 50vh; }
    }

    @media (max-width: 900px) {
      .avatar-panel { display: none; } /* Esconde avatares em telas pequenas */
      .bg-grid { opacity: 0.1; }
      .card { padding: 2rem 1.5rem; width: 90%; }
    }
  </style>
</head>
<body>
  
  <div class="scanlines"></div>

  <div class="bg-container">
    <div class="bg-grid"></div>
  </div>

  <div class="avatar-panel left">
    <div class="data-ring"></div>
    <img src="https://www.habbo.com.br/habbo-imaging/avatarimage?user=_JhonCortes_&action=std&direction=2&head_direction=2&gesture=sml&size=l&head_direction=3" 
         alt="JhonCortes" class="avatar-img">
    <div class="status-label">Diretor _JhonCortes_</div>
  </div>

  <div class="avatar-panel right">
    <div class="data-ring"></div>
    <img src="https://www.habbo.com.br/habbo-imaging/avatarimage?user=Janaelson667&action=std&direction=4&head_direction=4&gesture=sml&size=l&head_direction=3" 
         alt="Janaelson667" class="avatar-img">
    <div class="status-label">Vice-Diretor Janaelson667</div>
  </div>

  <div class="container">
    <div class="header">
      <img src="../rh.png" alt="RH FEB" class="logo-img">
      <h1 class="logo">POLÍCIA <span>FEB</span></h1>
      <p class="subtitle">Recursos Humanos Digital</p>
    </div>

    <div class="card">
      <div class="card-reflection"></div>
      <h2 class="card-title">Autenticação</h2>
      
      <div class="input-group">
        <label class="input-label" for="nick">Identificador (Nick)</label>
        <div class="input-wrapper">
            <input type="text" id="nick" placeholder="Seu nick Habbo" autocomplete="username" spellcheck="false">
        </div>
      </div>
      
      <div class="input-group">
        <label class="input-label" for="pass">Chave de Acesso</label>
        <div class="input-wrapper">
            <input type="password" id="pass" placeholder="Sua senha criptografada" autocomplete="current-password">
        </div>
      </div>
      
      <button id="btn-login">Acessar Terminal</button>
      <div class="msg" id="msg"></div>
    </div>

    <div class="footer">
      Terminal não autorizado? <a href="solicitar.html">Solicitar Credenciais</a>
    </div>
  </div>
  
  <div class="tech-line"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://hxcvjokstmwdcvwhvvvr.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh4Y3Zqb2tzdG13ZGN2d2h2dnZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExOTEwODQsImV4cCI6MjA5Njc2NzA4NH0._eBE0N4BRcbzw_cK2T3aZGWA_sLEvoiB2j1LEtJUTAI';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function showMessage(text, type) {
      const msg = document.getElementById('msg');
      msg.textContent = text;
      msg.className = `msg show ${type}`;
    }

    document.getElementById('btn-login').addEventListener('click', async () => {
      const btn = document.getElementById('btn-login');
      const nick = document.getElementById('nick').value.trim();
      const pass = document.getElementById('pass').value;

      if (!nick || !pass) {
        showMessage('⚠️ Preencha todos os campos do terminal.', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Criptografando...';
      showMessage('', '');

      const email = nick.replace(/[^a-zA-Z0-9]/g, '').toLowerCase() + '@feb.internal';

      try {
        const { data, error } = await sb.auth.signInWithPassword({ 
          email: email, 
          password: pass 
        });
        
        if (error) throw error;

        const { data: profile, error: profError } = await sb
          .from('profiles')
          .select('*')
          .eq('id', data.user.id)
          .single();
        
        if (profError) throw profError;

        if (profile.status === 'pendente') {
          await sb.auth.signOut();
          throw new Error('⏳ Acesso pendente de aprovação superior.');
        }
        if (profile.status === 'banido') {
          await sb.auth.signOut();
          throw new Error('🚫 Acesso revogado permanentemente.');
        }
        if (profile.status === 'inativo') {
          await sb.auth.signOut();
          throw new Error('⚠️ Conta inativa no sistema.');
        }
        
        if (profile.first_login) {
          window.location.href = 'primeiro-acesso.html';
          return;
        }

        try {
          await sb.from('system_logs').insert({
            user_id: data.user.id,
            action: 'LOGIN_SUCESSO',
            details: 'Terminal Web - Nick: ' + profile.habbo_nick,
            ip_address: 'web_hk'
          });
        } catch (logErr) { console.warn('Erro log:', logErr); }
        
        showMessage('✅ Bio-autorização confirmada. Redirecionando...', 'success');
        setTimeout(() => { window.location.href = '../dashboard.html'; }, 1000);

      } catch (err) {
        console.error('Login error:', err);
        showMessage('❌ ' + (err.message || 'Falha na autenticação.'), 'error');
        btn.disabled = false;
        btn.textContent = 'Acessar Terminal';
      }
    });

    // Inputs de atalho
    document.getElementById('pass').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') document.getElementById('btn-login').click();
    });
    document.getElementById('nick').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') document.getElementById('pass').focus();
    });
  </script>
</body>
</html>
