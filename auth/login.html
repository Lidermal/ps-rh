<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="rh.png">
  <title>Login | Polícia FEB - RH</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-deep: #0a0e27;
      --bg-card: rgba(26, 31, 58, 0.7);
      --cyan: #00d9ff;
      --gold: #f59e0b;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --border: rgba(0, 217, 255, 0.2);
      --success: #10b981;
      --error: #ef4444;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-deep);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(rgba(0, 217, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 217, 255, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at center, rgba(0, 217, 255, 0.08) 0%, transparent 50%);
      pointer-events: none;
    }
    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
    }
    .header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .badge {
      display: inline-block;
      padding: 6px 16px;
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid var(--gold);
      border-radius: 20px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--gold);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }
    .logo {
      font-family: 'Rajdhani', sans-serif;
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 2px;
      margin-bottom: 0.5rem;
    }
    .logo span {
      background: linear-gradient(135deg, var(--cyan) 0%, var(--gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      letter-spacing: 1px;
    }
    .card {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }
    .card-title {
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .card-title::before {
      content: '';
      width: 4px;
      height: 24px;
      background: var(--gold);
      border-radius: 2px;
      box-shadow: 0 0 10px var(--gold);
    }
    .card-desc {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 2rem;
      line-height: 1.5;
    }
    .input-group {
      margin-bottom: 1.5rem;
    }
    .input-label {
      display: block;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(10, 14, 39, 0.6);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 1rem;
      font-family: 'Inter', sans-serif;
      transition: all 0.3s;
    }
    input:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
      background: rgba(10, 14, 39, 0.9);
    }
    input::placeholder { color: #475569; }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--gold) 0%, #d97706 100%);
      border: none;
      border-radius: 10px;
      color: var(--bg-deep);
      font-size: 1rem;
      font-weight: 700;
      font-family: 'Rajdhani', sans-serif;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s;
    }
    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(245, 158, 11, 0.3);
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .msg {
      font-size: 0.9rem;
      text-align: center;
      margin-top: 1.2rem;
      padding: 12px;
      border-radius: 8px;
      display: none;
    }
    .msg.show { display: block; }
    .msg.success { 
      color: var(--success); 
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .msg.error { 
      color: var(--error); 
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .footer a {
      color: var(--cyan);
      text-decoration: none;
      font-weight: 500;
    }
    .footer a:hover { text-decoration: underline; }
    @media (max-width: 480px) {
      .card { padding: 2rem 1.5rem; }
      .logo { font-size: 2rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="badge">Acesso Restrito</div>
      <h1 class="logo">POLÍCIA <span>FEB</span></h1>
      <p class="subtitle">Órgão de Recursos Humanos</p>
    </div>

    <div class="card">
      <h2 class="card-title">Autenticação</h2>
      <p class="card-desc">Insira suas credenciais para acessar o sistema interno.</p>
      
      <div class="input-group">
        <label class="input-label" for="nick">Nickname</label>
        <input type="text" id="nick" placeholder="Seu nick do Habbo" autocomplete="username" spellcheck="false">
      </div>
      
      <div class="input-group">
        <label class="input-label" for="pass">Senha</label>
        <input type="password" id="pass" placeholder="Sua senha pessoal" autocomplete="current-password">
      </div>
      
      <button id="btn-login">Entrar no Sistema</button>
      <div class="msg" id="msg"></div>
    </div>

    <div class="footer">
      Não tem acesso? <a href="solicitar.html">Solicite aqui</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://hxcvjokstmwdcvwhvvvr.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh4Y3Zqb2tzdG13ZGN2d2h2dnZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExOTEwODQsImV4cCI6MjA5Njc2NzA4NH0._eBE0N4BRcbzw_cK2T3aZGWA_sLEvoiB2j1LEtJUTAI';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function showMessage(text, type) {
      const msg = document.getElementById('msg');
      msg.textContent = text;
      msg.className = `msg show ${type}`;
    }

    document.getElementById('btn-login').addEventListener('click', async () => {
      const btn = document.getElementById('btn-login');
      const nick = document.getElementById('nick').value.trim();
      const pass = document.getElementById('pass').value;

      if (!nick || !pass) {
        showMessage('❌ Preencha todos os campos.', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Autenticando...';
      showMessage('', '');

      const email = nick.replace(/[^a-zA-Z0-9]/g, '').toLowerCase() + '@feb.internal';

      try {
        const { data, error } = await sb.auth.signInWithPassword({ 
          email: email, 
          password: pass 
        });
        
        if (error) throw error;

        const { data: profile, error: profError } = await sb
          .from('profiles')
          .select('status, first_login, habbo_nick, role')
          .eq('id', data.user.id)
          .single();
        
        if (profError) throw profError;

        if (profile.status === 'pendente') {
          await sb.auth.signOut();
          throw new Error('⏳ Seu acesso ainda está pendente. Aguarde a aprovação.');
        }
        if (profile.status === 'banido') {
          await sb.auth.signOut();
          throw new Error('🚫 Sua conta foi banida.');
        }
        if (profile.status === 'inativo') {
          await sb.auth.signOut();
          throw new Error('⚠️ Sua conta está inativa.');
        }
        
        if (profile.first_login) {
          window.location.href = 'primeiro-acesso.html';
          return;
        }

        await sb.from('system_logs').insert({
          user_id: data.user.id,
          action: 'LOGIN_SUCESSO',
          details: 'Nick: ' + profile.habbo_nick,
          ip_address: 'web'
        });
        
        showMessage('✅ Acesso autorizado! Redirecionando...', 'success');
        setTimeout(() => {
          window.location.href = '../dashboard.html';
        }, 800);
      } catch (err) {
        showMessage('❌ ' + (err.message || 'Credenciais inválidas.'), 'error');
        btn.disabled = false;
        btn.textContent = 'Entrar no Sistema';
      }
    });

    document.getElementById('pass').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') document.getElementById('btn-login').click();
    });
    document.getElementById('nick').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') document.getElementById('pass').focus();
    });
  </script>
</body>
</html>
