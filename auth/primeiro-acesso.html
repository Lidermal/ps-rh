<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Primeiro Acesso | Polícia FEB - RH</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-deep: #0a0e27;
      --bg-card: rgba(26, 31, 58, 0.7);
      --green: #10b981;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --border: rgba(16, 185, 129, 0.2);
      --error: #ef4444;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-deep);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container { width: 100%; max-width: 440px; }
    .header { text-align: center; margin-bottom: 2rem; }
    .logo-img {
      width: 100px;
      height: 100px;
      object-fit: contain;
      margin-bottom: 1rem;
      filter: drop-shadow(0 0 20px rgba(16, 185, 129, 0.3));
    }
    .badge {
      display: inline-flex;
      padding: 6px 14px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid var(--green);
      border-radius: 20px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--green);
      text-transform: uppercase;
      margin-bottom: 1rem;
    }
    .logo {
      font-family: 'Rajdhani', sans-serif;
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    .logo span {
      background: linear-gradient(135deg, var(--green) 0%, #00d9ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle { color: var(--text-muted); }
    .card {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem 2rem;
    }
    .card-title {
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }
    .card-desc { color: var(--text-muted); margin-bottom: 2rem; }
    .input-group { margin-bottom: 1.2rem; }
    .input-label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    input {
      width: 100%;
      padding: 14px;
      background: rgba(10, 14, 39, 0.6);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 1rem;
    }
    input:focus {
      outline: none;
      border-color: var(--green);
    }
    .strength-bar {
      height: 4px;
      background: rgba(255,255,255,0.1);
      margin-top: 8px;
      border-radius: 2px;
      overflow: hidden;
    }
    .strength-fill {
      height: 100%;
      width: 0;
      transition: all 0.3s;
    }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--green) 0%, #059669 100%);
      border: none;
      border-radius: 10px;
      color: var(--bg-deep);
      font-size: 1rem;
      font-weight: 600;
      font-family: 'Rajdhani', sans-serif;
      cursor: pointer;
      text-transform: uppercase;
      margin-top: 0.5rem;
    }
    button:hover:not(:disabled) { transform: translateY(-2px); }
    button:disabled { opacity: 0.6; }
    .msg {
      margin-top: 1.2rem;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
    }
    .msg.error { color: var(--error); background: rgba(239, 68, 68, 0.1); }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="../rh.png" alt="RH" class="logo-img">
      <div class="badge">Primeiro Acesso</div>
      <h1 class="logo">POLÍCIA <span>FEB</span></h1>
      <p class="subtitle">Crie sua senha pessoal</p>
    </div>

    <div class="card">
      <h2 class="card-title">Definir Senha</h2>
      <p class="card-desc">Sua conta foi aprovada. Crie uma senha segura.</p>
      
      <div class="input-group">
        <label class="input-label">Nova Senha (mín. 6 caracteres)</label>
        <input type="password" id="new-pass" placeholder="••••••">
        <div class="strength-bar"><div class="strength-fill" id="strength"></div></div>
      </div>
      
      <div class="input-group">
        <label class="input-label">Confirmar Senha</label>
        <input type="password" id="confirm-pass" placeholder="••••••">
      </div>
      
      <button id="btn-save">Finalizar e Acessar</button>
      <div class="msg" id="msg"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://hxcvjokstmwdcvwhvvvr.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh4Y3Zqb2tzdG13ZGN2d2h2dnZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExOTEwODQsImV4cCI6MjA5Njc2NzA4NH0._eBE0N4BRcbzw_cK2T3aZGWA_sLEvoiB2j1LEtJUTAI';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) window.location.href = 'login.html';
    })();

    document.getElementById('new-pass').addEventListener('input', (e) => {
      const len = e.target.value.length;
      const fill = document.getElementById('strength');
      const pct = Math.min(len * 10, 100);
      fill.style.width = pct + '%';
      fill.style.background = len < 6 ? '#ef4444' : len < 10 ? '#f59e0b' : '#10b981';
    });

    document.getElementById('btn-save').addEventListener('click', async () => {
      const btn = document.getElementById('btn-save');
      const msg = document.getElementById('msg');
      const pass = document.getElementById('new-pass').value;
      const confirm = document.getElementById('confirm-pass').value;

      if (pass.length < 6) {
        msg.textContent = '❌ Mínimo 6 caracteres.';
        msg.className = 'msg error';
        return;
      }
      if (pass !== confirm) {
        msg.textContent = '❌ Senhas não coincidem.';
        msg.className = 'msg error';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Configurando...';

      try {
        const { error } = await sb.auth.updateUser({ password: pass });
        if (error) throw error;

        const { data: { user } } = await sb.auth.getUser();
        await sb.from('profiles').update({ first_login: false }).eq('id', user.id);

        msg.textContent = '✅ Concluído! Redirecionando...';
        msg.style.color = '#10b981';
        msg.style.background = 'rgba(16, 185, 129, 0.1)';
        
        setTimeout(() => {
          window.location.href = '../dashboard.html';
        }, 1000);
      } catch (err) {
        msg.textContent = '❌ ' + err.message;
        msg.className = 'msg error';
        btn.disabled = false;
        btn.textContent = 'Finalizar e Acessar';
      }
    });

    document.getElementById('confirm-pass').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') document.getElementById('btn-save').click();
    });
  </script>
</body>
</html>
